<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Démo · Tablo</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
/* VOICE: nuit, luxe, festif mais net — un produit fini, pas une maquette
   IDEA: le widget est une carte d'invitation VIP qui s'ouvre en grand
   PICTURE: plan 3D propre à chaque lieu et bouteille en vraie 3D sur un socle lumineux
   COLOUR and TYPE: noir velours + couleur du lieu (or pour le club, corail pour la plage) ; Unbounded + Manrope
   LAYOUT: faux site, bouton flottant, petit panneau puis grande fenêtre avec récap à droite */
:root{color-scheme:dark;--holo:linear-gradient(110deg,#ff5fa2 0%,#a970ff 30%,#4fd8ff 60%,#b6ff6a 85%,#ff5fa2 100%);--bg:#060607;--p:#121216;--p2:#19191e;--line:#26262d;--ink:#f3f2f7;--mute:#8e8c99;--c:#d9b46a;--c2:#f0d495;--pink:#ff3d8b;--ok:#3ddc97;--bad:#ff6b6b}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Unbounded,Manrope,sans-serif;font-weight:700;line-height:1.05;margin:0;text-wrap:balance}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.demo{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;background:#0c0c0f;border-bottom:1px solid var(--line);font-size:13px;padding:8px 12px;color:var(--mute)}
.demo .seg button{padding:6px 12px;min-height:34px;font-size:13px}
.nav{display:flex;align-items:center;gap:24px;padding:18px max(5vw,16px);flex-wrap:wrap}
.logo{font-family:Unbounded;font-size:20px;letter-spacing:.06em}
.logo b{color:var(--c)}
.nav a{color:var(--mute);text-decoration:none;font-size:15px}
.nav .sp{flex:1}
.btn{border:0;border-radius:var(--br,12px);padding:12px 22px;font-weight:800;background:var(--cb,var(--c));background-size:200% 100%;color:var(--btx,#1a1205);min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.hero{position:relative;min-height:min(72vh,600px);display:grid;align-content:end;padding:0 max(5vw,16px) 64px;overflow:hidden;isolation:isolate}
.beams{position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 110%,#3a1240 0,transparent 60%),radial-gradient(ellipse at 80% 0,#2a1d08 0,transparent 50%),var(--bg)}
.beach .beams{background:radial-gradient(circle at 70% 78%,#ffd19a 0 7%,#ff8a5b 12%,transparent 30%),linear-gradient(#170b26 0,#4a1e48 45%,#c8565a 80%,#ff8a5b 100%)}
.beam{position:absolute;top:-10%;left:50%;width:140px;height:130%;transform-origin:50% 0;background:linear-gradient(to bottom,color-mix(in srgb,var(--c) 55%,transparent),transparent 75%);filter:blur(6px);mix-blend-mode:screen;animation:sweep 7s ease-in-out infinite alternate}
.beam:nth-child(2){background:linear-gradient(to bottom,rgba(255,61,139,.5),transparent 70%);animation-duration:9s;animation-delay:-3s}
.beam:nth-child(3){animation-duration:11s;animation-delay:-6s;width:90px}
.beam:nth-child(4){background:linear-gradient(to bottom,rgba(140,90,255,.45),transparent 70%);animation-duration:8s;animation-delay:-1s}
.beach .beam{opacity:.35}
@keyframes sweep{from{transform:rotate(-38deg)}to{transform:rotate(38deg)}}
.crowd{position:absolute;left:0;right:0;bottom:0;height:120px;z-index:-1}
.hero h1{font-size:clamp(44px,9vw,104px);letter-spacing:.02em}
.hero p{color:#d9d0e3;max-width:52ch;margin:14px 0 26px}
.hero .row{display:flex;gap:12px;flex-wrap:wrap}
.band{padding:clamp(28px,4vw,64px) max(5vw,16px)}
.evs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:16px;margin-top:24px}
.ev{background:var(--p);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:8px}
.ev .d{color:var(--c);font-weight:800}
.ev h3{font-size:22px}
.ev .m{color:var(--mute);font-size:15px}
.infos{display:flex;gap:28px;flex-wrap:wrap;color:var(--mute);font-size:15px;border-top:1px solid var(--line)}
.infos b{color:var(--ink);display:block}
.fab{position:fixed;right:20px;bottom:20px;z-index:20;display:flex;align-items:center;gap:10px;border:0;border-radius:var(--br,12px);background:var(--cb,var(--c));background-size:200% 100%;color:var(--btx,#1a1205);padding:14px 20px;font-weight:800;box-shadow:0 10px 40px color-mix(in srgb,var(--c) 40%,transparent);min-height:52px}
.fab svg{width:20px;height:20px}
.panel{position:fixed;right:20px;bottom:20px;z-index:30;width:min(380px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto;background:var(--p);border:1px solid var(--line);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.6);display:none;animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
.panel.on{display:block}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 18%,var(--p)),var(--p));border-bottom:1px solid var(--line)}
.ph .logo{font-size:16px}
.x{background:none;border:0;width:44px;height:44px;border-radius:10px;font-size:22px;color:var(--mute)}
.msg{margin:16px 18px 6px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--c) 10%,transparent);border:1px solid color-mix(in srgb,var(--c) 30%,transparent);font-size:14px}
.sec{padding:12px 18px}
.lab{font-size:13px;color:var(--mute);font-weight:700;margin-bottom:8px;display:block}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chip{border:1px solid var(--line);background:var(--p2);border-radius:12px;padding:10px 6px;text-align:center;min-height:44px;font-size:14px;line-height:1.25}
.chip small{display:block;color:var(--mute);font-size:12px}
.chip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--p2);font-size:20px}
.stepper button.btn{width:auto;background:var(--c);color:var(--btx,#1a1205);border:0;padding:0 18px;font-size:15px}
.stepper output{min-width:64px;text-align:center;font-weight:800;font-size:18px}
.member{display:flex;gap:12px;align-items:center;margin:6px 18px 0;padding:12px 14px;border-radius:14px;background:linear-gradient(120deg,color-mix(in srgb,var(--c) 22%,var(--p2)),var(--p2));border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.member .ic{width:40px;height:40px;border-radius:50%;background:var(--c);color:var(--btx,#1a1205);display:grid;place-items:center;font-weight:800;flex:none}
.member small{color:var(--mute);display:block;font-size:13px}
.link{background:none;border:0;color:var(--c);text-decoration:underline;padding:4px 0;font-size:13px}
.mt{font-size:13px;color:var(--mute);margin-top:6px}
.pf{padding:16px 18px 10px}
.pf .btn{width:100%}
.by{text-align:center;color:var(--mute);font-size:12px;padding:8px 0 14px}
.by b{color:var(--ink)}
.ov{position:fixed;inset:0;z-index:40;background:rgba(5,3,8,.72);backdrop-filter:blur(6px);display:none;place-items:center;padding:20px}
.ov.on{display:grid}
.modal{width:min(1140px,100%);height:min(780px,calc(100vh - 40px));background:var(--p);border:1px solid var(--line);border-radius:22px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;animation:pop .4s cubic-bezier(.2,.9,.3,1.1);box-shadow:0 40px 120px rgba(0,0,0,.7)}
.mh{display:flex;align-items:center;gap:16px;padding:12px 16px 12px 22px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 18%,var(--p)),var(--p))}
.steps{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.steps button{border:0;background:none;color:var(--mute);padding:8px 12px;border-radius:10px;white-space:nowrap;font-size:14px;font-weight:700;min-height:40px}
.steps button.on{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.steps button.done{color:var(--ink)}
.steps button:disabled{opacity:.35;cursor:default}
.mb{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:0;position:relative}
.main{overflow:auto;padding:22px 26px 30px}
.main h2{font-size:24px;margin-bottom:6px}
.sub{color:var(--mute);margin:0 0 18px;font-size:15px}
.aside{border-left:1px solid var(--line);background:var(--p2);overflow:auto;padding:20px}
.aside h3{font-size:16px;margin-bottom:12px}
.rl{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}
.rl span:last-child{white-space:nowrap;font-weight:700}
.rl.mut{color:var(--mute)}
.rl.disc span:last-child{color:var(--ok)}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-family:Unbounded;font-size:22px}
.rewl{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.rewl b{width:100%;font-size:14px}
.lead{margin-top:16px;border:1px solid var(--line);border-radius:16px;background:var(--p2);padding:12px}
.lh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.lh .seg button{min-height:32px;padding:4px 10px;font-size:12px}
.lr{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:10px}.lr.me{background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid var(--c)}
.lr .rk{width:18px;font-weight:800;color:var(--mute);text-align:center}.lr .n{flex:1;font-weight:700;font-size:14px}.lr .n small{display:block;font-weight:400;color:var(--mute);font-size:12px}.lr b{font-size:13px;white-space:nowrap}
.earn{margin-top:10px;font-size:13px;color:var(--c)}
.mf{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line);background:var(--p)}
.mf .t{flex:1;font-size:14px;color:var(--mute)}
.mf .t b{color:var(--ink);font-size:18px;font-family:Unbounded}
.mf .det{display:none}
.panel,.modal,.fab,.studio{font-family:var(--wf,Manrope),system-ui,sans-serif}
.panel,.modal{color:var(--ink)}
.panel h1,.panel h2,.panel h3,.modal h2,.modal h3,.modal .logo,.panel .logo,.modal .tot,.modal .price,.modal .code{font-family:var(--hf,Unbounded),Manrope,sans-serif}
.wlogo{max-height:34px;max-width:150px;display:block;object-fit:contain}
.studio{position:fixed;left:0;top:0;bottom:0;width:min(380px,92vw);z-index:70;background:#0c0c0f;color:#f3f2f7;border-right:1px solid #26262d;overflow:auto;padding:18px;display:none;box-shadow:20px 0 60px rgba(0,0,0,.5)}
.studio.on{display:block}
.studio h3{font-family:Unbounded;font-size:17px;margin:0 0 4px}
.studio .amb{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.studio .amb button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:10px;border-radius:14px;border:1px solid #26262d;background:#141418;color:#f3f2f7;font-weight:700;font-size:13px;text-align:left;min-height:48px}
.studio .amb button i{display:block;width:100%;height:46px;border-radius:9px;position:relative;overflow:hidden}
.studio .amb button i em{position:absolute;left:8px;bottom:6px;font-style:normal;font-size:15px;line-height:1}
.studio .amb button small{color:#8e8c99;font-weight:600;font-size:11px}
.studio .amb button.on{border-color:#fff;background:#1c1c22}
.studio h3{font-family:Unbounded,system-ui,sans-serif}
.studio .sg{border-top:1px solid #222228;padding:16px 0;display:grid;gap:8px}
.studio .sg>b{font-size:13px}
.studio label{font-size:13px;color:#a99fb6;display:grid;gap:5px}
.studio input[type=text],.studio input[type=number],.studio textarea,.studio select{background:#1c1726;border:1px solid #2e2639;border-radius:10px;color:#f4efe7;padding:9px 10px;font:inherit;font-size:14px;min-height:40px}
.studio .sw{display:flex;gap:6px;flex-wrap:wrap}
.studio .sw button{width:30px;height:30px;border-radius:50%;border:2px solid #2e2639}
.studio .sw button.on{border-color:#fff}
.studio .seg2{display:flex;flex-wrap:wrap;border:1px solid #26262d;border-radius:10px;overflow:hidden}
.studio .seg2 button{flex:1;border:0;background:none;color:#a99fb6;min-height:38px;font-size:13px;font-weight:700}
.studio .seg2 button.on{background:#fff;color:#08080a}
.studio .tg{width:auto!important;height:auto!important;border-radius:99px!important;padding:5px 9px;font-size:11px;font-weight:700;background:#1c1726;color:#a99fb6;border:1px solid #2e2639!important}
.studio .tg.on{background:#f4efe7;color:#111;border-color:#f4efe7!important}
.nbprev{position:relative;height:150px;border-radius:12px;background:radial-gradient(ellipse at 50% 90%,rgba(255,255,255,.25),transparent 55%),#0d0a12;display:grid;place-items:center;border:1px solid #2e2639}
.nbprev img{max-height:130px;max-width:90%;object-fit:contain}.nbprev.staged{background:radial-gradient(ellipse at 50% 85%,color-mix(in srgb,var(--c) 55%,transparent),transparent 60%),radial-gradient(ellipse at 50% 40%,#2a1830,#07050a 75%)}
.nbprev span{position:absolute;left:8px;top:8px;font-size:11px;font-weight:800;background:rgba(0,0,0,.6);padding:3px 8px;border-radius:99px}
.studio .srow{display:grid;grid-template-columns:minmax(0,1fr) 74px 90px;gap:6px;align-items:center;font-size:12px}
.studio .srow input{min-height:34px!important;padding:6px!important;font-size:13px!important}
.incsec{margin-top:16px;border:1px solid var(--c);border-radius:16px;padding:14px;background:color-mix(in srgb,var(--c) 6%,transparent)}
.inch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}.inch b{font-size:16px}.inch span{font-weight:800;color:var(--c)}
.incg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.incc{border:1px solid var(--line);background:var(--p2);border-radius:14px;overflow:hidden;padding:0 0 10px;display:grid;gap:4px;text-align:left}
.incc .ipv{position:relative;display:block;aspect-ratio:16/9;background:#07050a;overflow:hidden}.incc .ipv canvas,.incc .ipv img,.incc .ipv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.incc b{font-size:13px;padding:0 10px;line-height:1.25}.incc em{font-style:normal;font-size:12px;font-weight:800;color:var(--mute);padding:0 10px}
.incc.on{border-color:var(--c)}.incc.on em{color:var(--c)}.incc:disabled{opacity:.45;cursor:not-allowed}
img.cutimg{object-fit:contain!important;background:radial-gradient(ellipse at 50% 85%,color-mix(in srgb,var(--c) 55%,transparent),transparent 60%),radial-gradient(ellipse at 50% 40%,#2a1830,#07050a 75%)!important;padding:6% 0}
.freebar{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;border:1px dashed var(--c);background:color-mix(in srgb,var(--c) 8%,transparent);font-size:14px;margin-top:16px}
.freebar b{color:var(--c)}
.freepick{margin-top:8px;border:1px solid var(--line);background:var(--p);color:var(--ink);border-radius:var(--br,12px);min-height:34px;padding:0 12px;font-size:12px;font-weight:800}
.freepick.on{background:var(--c);color:var(--btx,#1a1205);border-color:var(--c)}
.pr s{color:var(--mute);font-weight:600;margin-right:4px}
.pr em{font-style:normal;color:var(--ok)}
/* plan 3D : mobilier en relief, étiquettes debout */
.stage{position:relative;height:420px;perspective:1100px;perspective-origin:50% 38%;display:grid;place-items:center;border-radius:18px;background:radial-gradient(ellipse at 50% 30%,#24182f,#0b0810 72%);overflow:hidden}
.beachv .stage{background:radial-gradient(ellipse at 50% 0%,#ffb27a 0,#e2706a 22%,#5a2b55 55%,#160d1d 85%)}
.floor{--cat:var(--c);position:relative;width:min(620px,94%);aspect-ratio:3/2;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1);border-radius:16px;color:#fff;
 background:radial-gradient(ellipse at 50% 42%,color-mix(in srgb,var(--c) 16%,transparent),transparent 62%),repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 8.33%),repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 12.5%),linear-gradient(160deg,#1b1424,#0f0b15);
 box-shadow:0 0 0 1.5px color-mix(in srgb,var(--c) 45%,#2a2234),0 0 26px color-mix(in srgb,var(--c) 22%,transparent),0 60px 80px rgba(0,0,0,.65)}
.floor::before{content:"";position:absolute;left:0;right:0;top:100%;height:18px;transform-origin:top;transform:rotateX(-90deg);background:linear-gradient(#1c1526,#07050a);border-radius:0 0 12px 12px;box-shadow:inset 0 1.5px 0 color-mix(in srgb,var(--c) 70%,transparent)}
.floor.beach{background:radial-gradient(ellipse at 25% 85%,#f6e2bb,transparent 45%),radial-gradient(ellipse at 80% 60%,#f1d7a6,transparent 40%),repeating-radial-gradient(circle at 30% 40%,rgba(120,80,30,.05) 0 1.5px,transparent 1.5px 6px),#e6c991;box-shadow:0 0 0 2px #cfae76,0 60px 80px rgba(0,0,0,.55)}
.floor.beach::before{background:linear-gradient(#c9a26a,#8a6638);box-shadow:none}
.el{position:absolute;display:grid;place-items:center;text-align:center;transform-style:preserve-3d;font:800 9px/1 Manrope,sans-serif;letter-spacing:.16em}
.el>span{pointer-events:none}
/* décor du club */
.dj{transform:translateZ(16px);border-radius:8px;background:radial-gradient(circle at 26% 55%,#0b0810 0 13%,#3a2f4c 14% 17%,transparent 18%),radial-gradient(circle at 74% 55%,#0b0810 0 13%,#3a2f4c 14% 17%,transparent 18%),linear-gradient(135deg,#2c2142,#140e20);border:1px solid #8f73ff;box-shadow:0 0 24px rgba(124,92,255,.6),inset 0 0 14px rgba(124,92,255,.35);color:#d9ccff}
.dj>span{transform:translateY(-140%);font-size:8px}
.dj::before,.bar::before{content:"";position:absolute;left:-1px;right:-1px;top:100%;height:16px;transform-origin:top;transform:rotateX(-90deg);border-radius:0 0 6px 6px;background:linear-gradient(#3b2b5e,#120c1c);box-shadow:inset 0 2px 0 #a78bff}
.dance{border-radius:12px;color:rgba(255,255,255,.75);
 background:repeating-linear-gradient(90deg,rgba(8,6,12,.85) 0 1.5px,transparent 1.5px 12.5%),repeating-linear-gradient(0deg,rgba(8,6,12,.85) 0 1.5px,transparent 1.5px 16.66%),linear-gradient(115deg,#ff3d8b,#7c5cff,#3fd0ff,#ffcf5c,#ff3d8b);background-size:auto,auto,300% 300%;animation:led 7s linear infinite;
 box-shadow:0 0 30px color-mix(in srgb,#ff3d8b 40%,transparent),inset 0 0 22px rgba(0,0,0,.55);opacity:.92}
.dance>span{background:rgba(8,6,12,.55);padding:4px 7px;border-radius:6px}
@keyframes led{0%{background-position:0 0,0 0,0% 50%}100%{background-position:0 0,0 0,100% 50%}}
.bar{transform:translateZ(14px);border-radius:7px;color:#f6dea0;background:radial-gradient(circle,#ffe7a8 0 1.6px,transparent 2.2px) 0 22%/7% 40% repeat-x,linear-gradient(#5c4421,#2a1d0c);border:1px solid #d9b46a;box-shadow:0 0 20px rgba(217,180,106,.45)}
.bar::before{background:linear-gradient(#4a3418,#160f06);box-shadow:inset 0 2px 0 #f0d495}
.bar>span{transform:translateY(25%)}
.beach .bar{color:#ffe9cf;background:repeating-linear-gradient(90deg,#9b6a3c 0 7px,#86592f 7px 8px);border-color:#e9c48f;box-shadow:0 8px 16px rgba(80,50,20,.35)}
.beach .bar::before{background:linear-gradient(#7a5129,#4a2f16);box-shadow:inset 0 2px 0 #e9c48f}
.ent{color:rgba(255,255,255,.55);letter-spacing:.12em}
.beach .ent{color:#7a5a34}
/* décor plage */
.sea{border-radius:16px 16px 0 0;color:#eafcff;background:repeating-linear-gradient(178deg,transparent 0 7px,rgba(255,255,255,.16) 7px 8.5px),linear-gradient(180deg,#0b5f7d,#1795b5 70%,#56d3e4);background-size:100% 200%,auto;animation:seaw 5s linear infinite}
.sea::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:9px;background:radial-gradient(circle at 50% 0,#fff 0 46%,transparent 52%) 0 0/16px 9px repeat-x;opacity:.85;animation:foam 3.2s ease-in-out infinite alternate}
@keyframes seaw{to{background-position:0 100%,0 0}}
@keyframes foam{to{transform:translateY(3px);opacity:.55}}

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
(function loop(t){for(let i=ANIMS.length-1;i>=0;i--){const a=ANIMS[i];if(!a.cv.isConnected){ANIMS.splice(i,1);continue}a.step(reduce?1500:t)}requestAnimationFrame(loop)})(0);
const preview=k=>{const m=S.media[k];return m?(m.type==='video'?`<video src="${m.url}" autoplay muted loop playsinline></video>`:`<img src="${m.url}" alt="" class="${m.type==='cut'?'cutimg':''}">`):`<canvas data-anim="${SHOWS[k].a}"></canvas>`};

function qr(seed){
 let r=seed,out='';const n=25,rnd=()=>(r=(r*9301+49297)%233280)/233280;
 const fin=(a,b)=>`<rect x="${a}" y="${b}" width="7" height="7"/><rect x="${a+1}" y="${b+1}" width="5" height="5" fill="#fff"/><rect x="${a+2}" y="${b+2}" width="3" height="3"/>`;
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){if((x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16))continue;if(rnd()>.52)out+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
 return `<svg viewBox="-1 -1 27 27" shape-rendering="crispEdges">${out}${fin(0,0)}${fin(18,0)}${fin(0,18)}</svg>`;
}

function cutout(file,cb){const im=new Image();im.onload=()=>{const sc=Math.min(1,700/Math.max(im.width,im.height)),W=Math.round(im.width*sc),H=Math.round(im.height*sc),cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');x.drawImage(im,0,0,W,H);
 const d=x.getImageData(0,0,W,H),a=d.data,ref=[0,(W-1)*4,(H-1)*W*4,((H-1)*W+W-1)*4].map(i=>[a[i],a[i+1],a[i+2]]),br=ref.reduce((p,c)=>[p[0]+c[0]/4,p[1]+c[1]/4,p[2]+c[2]/4],[0,0,0]);
 const seen=new Uint8Array(W*H),st=[];for(let i=0;i<W;i++){st.push(i,(H-1)*W+i)}for(let j=0;j<H;j++){st.push(j*W,j*W+W-1)}
 const near=i=>{const q=i*4;return a[q+3]<20||Math.abs(a[q]-br[0])+Math.abs(a[q+1]-br[1])+Math.abs(a[q+2]-br[2])<60};
 while(st.length){const i=st.pop();if(seen[i])continue;seen[i]=1;if(!near(i))continue;a[i*4+3]=0;const px=i%W,py=(i/W)|0;if(px>0)st.push(i-1);if(px<W-1)st.push(i+1);if(py>0)st.push(i-W);if(py<H-1)st.push(i+W)}
 let x0=W,y0=H,x1=0,y1=0;for(let j=0;j<H;j++)for(let i=0;i<W;i++)if(a[(j*W+i)*4+3]>30){if(i<x0)x0=i;if(i>x1)x1=i;if(j<y0)y0=j;if(j>y1)y1=j}
 x.putImageData(d,0,0);if(x1<=x0){cb(cv.toDataURL());return}const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(cv,x0,y0,o.width,o.height,0,0,o.width,o.height);cb(o.toDataURL('image/png'))};im.src=URL.createObjectURL(file)}

 if(sw){if(S.venue!==sw.dataset.v){S.venue=sw.dataset.v;S.date=1;reset();closeAll();site();if($('#studio').classList.contains('on'))studio();if(V){V.ring.material.color.set(VEN().c);V.pts.material.color.set(VEN().c2)}}return}

 const a=e.target.closest('[data-a]');if(!a)return;const v=a.dataset.v;let keep=false;
 switch(a.dataset.a){
  case 'pclose':if(EMB)return;closeAll();return;
  case 'lbclose':$('#lb').classList.remove('on');$('#lbpv').innerHTML='';return;

  case 'rew':S.rew=S.rew===v?null:v;keep=true;break;

 else if(f==='pts')S.usePts=el.checked;
 else if(f==='agree'){S.agree=el.checked;foot();return}
 else if(f==='org')S.org=Math.max(100,+el.value||100);
 else if(f==='photo'){const file=el.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{S.photo=r.result;photoImg=new Image();photoImg.src=r.result};r.readAsDataURL(file);return}
 else if(f==='bimg'){const file=el.files[0];if(!file)return;S.bimg[el.dataset.v]={type:/\.(glb|gltf)$/i.test(file.name)?'glb':'img',url:URL.createObjectURL(file)}}
 else if(f==='signimg'){const file=el.files[0];if(!file)return;S.signImg=URL.createObjectURL(file)}
 else if(f==='media'){const file=el.files[0];if(!file)return;S.media[el.dataset.v]={type:file.type.startsWith('video')?'video':'image',url:URL.createObjectURL(file)}}
 else return;
 render(true);
});
document.addEventListener('keydown',e=>{if(e.key!=='Escape'||EMB)return;if($('#lb').classList.contains('on')){$('#lb').classList.remove('on');$('#lbpv').innerHTML=''}else closeAll()});
$('#lb').addEventListener('click',e=>{if(e.target.id==='lb'){$('#lb').classList.remove('on');$('#lbpv').innerHTML=''}});

/* ---------- billetterie (entrées) ---------- */
const TIERS={club:[{id:'early',n:'Early',u:23.5,p:0,d:0,left:14},{id:'m',n:'Avant minuit',u:24.5,p:10,d:0},{id:'mc',n:'Avant minuit + conso',u:24.5,p:15,d:1},{id:'all',n:'Entrée + conso',u:null,p:20,d:1}],
 beach:[{id:'early',n:'Early',u:15,p:0,d:0,left:20},{id:'m',n:'Avant 17 h',u:17,p:15,d:0},{id:'mc',n:'Avant 17 h + cocktail',u:17,p:22,d:1},{id:'all',n:'Entrée + cocktail',u:null,p:30,d:1}]};
const T={tier:'m',q:2,h:22,done:false,code:''};
const hh=h=>{const x=((Math.floor(h)%24)+24)%24,m=Math.round((h%1)*60);return x+' h'+(m?' '+String(m).padStart(2,'0'):'')};
const tiers=()=>TIERS[S.venue==='beach'?'beach':'club'];
const tOpen=t=>!(t.u!==null&&T.h>=t.u)&&t.left!==0;
const tCur=()=>tiers().find(t=>t.id===T.tier);
function tFix(){if(!tCur()||!tOpen(tCur())){const f=tiers().find(tOpen);T.tier=f?f.id:null}}
function renderTix(){
 const v=VEN(),t=tCur(),tot=t?t.p*T.q:0,conso=n=>n===0?'Sans conso':n===1?(S.venue==='beach'?'1 cocktail inclus':'1 conso incluse'):n+' consos';
 $('.modal').classList.add('tix');
 if(T.done){
  const cells=Array.from({length:21*21},(_,i)=>{const x=i%21,y=i/21|0,f=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);const on=f?((x%14<7&&y%14<7)&&!(((x%14)>0&&(x%14)<6&&(y%14)>0&&(y%14)<6)&&!((x%14)>1&&(x%14)<5&&(y%14)>1&&(y%14)<5))):((x*7+y*13+x*y)%3===0);return on?`<rect x="${x}" y="${y}" width="1" height="1"/>`:''}).join('');
  $('#main').innerHTML=`<div class="tkt"><h2>À ce soir !</h2><p class="sub">${v.dates[S.date].d} · ${v.dates[S.date].ev} · ${T.q} entrée${T.q>1?'s':''}</p><div class="q"><svg viewBox="0 0 21 21" width="180" height="180" shape-rendering="crispEdges">${cells}</svg><code>${T.code}</code><small>Un seul QR code pour tout le groupe</small></div><div class="card" style="width:100%;text-align:left"><div class="rl"><span>${T.q} × ${t.n}</span><span>${tot?fmt(tot):'Gratuit'}</span></div><div class="rl"><span>${t.u!==null?'Arrivée avant '+hh(t.u):'Arrivée à toute heure'}</span><span>${conso(t.d)}</span></div></div><p class="sub" style="font-size:13px">Le videur scanne le code depuis son téléphone : il voit le nom, le tarif, et une alerte si le client arrive après l'heure.</p></div>`;
 }else{
  $('#main').innerHTML=`<h2>Prenez votre entrée</h2><p class="sub">Plus on arrive tôt, moins c'est cher. Le billet est un QR code envoyé par email.</p>
  <div class="tdates">${v.dates.map((d,i)=>`<button class="${i===S.date?'on':''}" data-a="tdate" data-v="${i}">${d.d}<small>${d.ev}</small></button>`).join('')}</div>
  <div class="clock">Démo : il est <b>${hh(T.h)}</b><input type="range" min="${S.venue==='beach'?12:20}" max="${S.venue==='beach'?20:28}" step=".5" value="${T.h}" data-t="hour" aria-label="Heure simulée"><span>Faites avancer l'heure : les tarifs se ferment tout seuls.</span></div>
  <div class="tiers">${tiers().map(x=>{const off=!tOpen(x);return `<button class="tier ${x.id===T.tier?'on':''}" data-a="tier" data-v="${x.id}" ${off?'disabled':''}><span class="h">${x.u!==null?`avant<b>${hh(x.u)}</b>`:'toute<b>la nuit</b>'}</span><span class="n">${x.n}<small>${conso(x.d)}${x.left?` · plus que ${x.left} places`:''}</small></span><span class="p">${off?`<span class="badge">${x.left===0?'Complet':'Terminé'}</span>`:x.p?fmt(x.p):'Gratuit'}</span></button>`}).join('')}</div>
  <h3 style="font-size:15px;margin:0 0 8px">Nombre d'entrées</h3><div class="tq"><button data-a="tq" data-v="-1" aria-label="Moins">−</button><b>${T.q}</b><button data-a="tq" data-v="1" aria-label="Plus">+</button></div>`;
 }
 const L=[`<div class="rl mut"><span>${v.dates[S.date].d}</span><span>${v.dates[S.date].ev}</span></div>`];
 if(t)L.push(`<div class="rl"><span>${T.q} × ${t.n}</span><span>${tot?fmt(tot):'Gratuit'}</span></div>`,`<div class="rl"><span>${t.u!==null?'Arrivée avant '+hh(t.u):'Toute la nuit'}</span><span>${conso(t.d)}</span></div>`);
 $('#aside').innerHTML=`<h3>Votre entrée</h3>${L.join('')}<div class="tot"><span>Total</span><span>${t?(tot?fmt(tot):'Gratuit'):'—'}</span></div><p style="font-size:12px;color:var(--mute);margin-top:14px;line-height:1.5">0 % de commission Tablo. Passé l'heure indiquée, le tarif n'est plus valable.</p>`;
 $('#mf').innerHTML=T.done?`<span></span><div class="t">Total <b>${tot?fmt(tot):'Gratuit'}</b></div><button class="btn" data-a="tnew">Terminer</button>`:`<span></span><div class="t">Total <b>${t?(tot?fmt(tot):'Gratuit'):'—'}</b></div><button class="btn" data-a="tpay" ${t?'':'disabled'}>${t?(tot?'Payer '+fmt(tot):'Réserver mes entrées'):'Tarifs terminés'}</button>`;
}

/* visite guidée pilotée depuis la landing : on remplit l'étape demandée */
function tour(n){
 if(S.mode!=='vip')setMode('vip');
 reset();
 const v=VEN();
 if(n>=1){const t=v.tables.find(t=>!v.taken[S.date].includes(t.id)&&t.cap>=S.people)||v.tables[0];S.table=t.id}
 if(n>=2&&tbl()){const t=tbl(),b=BOT.find(x=>x.id===S.focus)||BOT[0];S.focus=b.id;const key=b.id+'|0'+(b.fl?'|0':'');let g=0;while(botTotal()<t.min&&g++<30)S.bot[key]=(S.bot[key]||0)+1}
 if(n>=3&&tbl()){const k=v.shows.find(k=>catOf(tbl()).elig.includes(k));if(k)S.shows[k]=true;S.agree=true;S.org=dep()}
 S.step=Math.max(0,Math.min(3,n));S.max=S.step;S.detail=false;
 render();
}
function setMode(m){S.mode=m;document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.v===m));if(m==='tix'){tFix();renderTix()}else{$('.modal').classList.remove('tix');render()}}
document.addEventListener('input',e=>{if(e.target.dataset.t!=='hour')return;T.h=+e.target.value;tFix();const y=$('#main').scrollTop;renderTix();$('#main').scrollTop=y;const r=$('input[data-t=hour]');r&&r.focus()});
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;const v=a.dataset.v;
 switch(a.dataset.a){
  case 'mode':setMode(v);break;
  case 'tdate':S.date=+v;T.done=false;renderTix();break;
  case 'tier':T.tier=v;renderTix();break;
  case 'tq':T.q=Math.max(1,Math.min(20,T.q+ +v));renderTix();break;
  case 'tpay':T.code=Array.from({length:8},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');T.done=true;renderTix();$('#main').scrollTop=0;break;
  case 'tnew':T.done=false;T.q=2;renderTix();break;
 }});
site();
if(EMB){
 const q=new URLSearchParams(location.search);
 const go=()=>{reset();$('#ov').classList.add('on');if(S.mode==='tix')tFix();render()};
 const apply=d=>{
  if(d.venue&&d.venue!==S.venue&&VENUES[d.venue]){S.venue=d.venue;S.date=1;site()}
  if(d.amb&&AMB[d.amb])setAmb(d.amb);
  if(d.accent){VEN().theme.accent=d.accent;VEN().theme.grad=d.grad||''}
  if(d.btn)VEN().theme.btn=d.btn;
  if(typeof d.name==='string'){const v=VEN(),w=d.name.trim().slice(0,28).split(/\s+/);v.a=w.length>1?w.slice(0,-1).join(' '):(w[0]||'');v.b=w.length>1?w[w.length-1]:'';v.theme.logo=null}
  if(d.mode&&d.mode!==S.mode)setMode(d.mode);
  if(typeof d.tour==='number')tour(d.tour);
 };
 apply({venue:q.get('v'),amb:q.get('amb')});go();if(q.get('mode')==='tix')setMode('tix');
 addEventListener('message',e=>{const d=e.data;if(!d||d.tablo!==1)return;const v=S.venue;apply(d);if(S.venue!==v)go();else refreshAll()});
}
}
</script>
</body></html>
